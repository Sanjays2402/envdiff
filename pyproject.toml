[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "envdiff"
version = "0.1.0"
description = "Compare .env files and find missing, extra, or changed keys."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.8"
classifiers = ["License :: OSI Approved :: MIT License"]

[project.scripts]
envdiff = "envdiff.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
